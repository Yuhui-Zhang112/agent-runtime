name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 冒烟测试 · 流式内核（无需 API key）
        run: npm run smoke

      - name: 冒烟测试 · 工具系统（无需 API key）
        run: npm run smoke:tool

      - name: 冒烟测试 · 主循环（用剧本模型，无需 API key）
        run: npm run smoke:agent

      - name: 冒烟测试 · 并发调度（无需 API key）
        run: npm run smoke:exec

      - name: 冒烟测试 · 重试与退避（无需 API key）
        run: npm run smoke:retry

      - name: 冒烟测试 · 服务层（真实 HTTP + SSE，无需 API key）
        run: npm run smoke:server

      - name: 冒烟测试 · 权限系统（规则 / 审批 / Bash 安全，无需 API key）
        run: npm run smoke:permission
