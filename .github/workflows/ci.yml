name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 冒烟测试 · 流式内核（无需 API key）
        run: npm run smoke

      - name: 冒烟测试 · 工具系统（无需 API key）
        run: npm run smoke:tool

      - name: 冒烟测试 · 主循环（用剧本模型，无需 API key）
        run: npm run smoke:agent

      - name: 冒烟测试 · 并发调度（无需 API key）
        run: npm run smoke:exec

      - name: 冒烟测试 · 重试与退避（无需 API key）
        run: npm run smoke:retry

      - name: 冒烟测试 · 服务层（真实 HTTP + SSE，无需 API key）
        run: npm run smoke:server

      - name: 冒烟测试 · 权限系统（规则 / 审批 / Bash 安全，无需 API key）
        run: npm run smoke:permission

      - name: 冒烟测试 · 上下文压缩（自检回滚 / 配对 / Trace 持久化 / 可复现）
        run: npm run smoke:compaction

      - name: 冒烟测试 · Eval 门禁（产物一致性 / 结论方向 / 诚实边界）
        run: npm run smoke:eval

      - name: 评测套件（压缩 A/B + 12 个 issue 场景回归 + 汇总门禁）
        run: npm run eval:all

      - name: 评测产物可复现（重跑后 reports/ 不得有 diff）
        run: git diff --exit-code -- reports/

      - name: 构建产物（内核 + TypeScript 看板）
        run: npm run build:all

      - name: 看板产物与 TS 源码一致（禁止手写/陈旧的 dashboard.js）
        run: git diff --exit-code -- public/dashboard.js
